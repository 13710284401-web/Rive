<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff7fa2">
  <title>蓓蓓英语｜智能学习</title>
  <style>
    :root {
      --pink: #ff7fa2;
      --coral: #ff9a8b;
      --teal: #42cfc2;
      --blue: #5b9df4;
      --ink: #28314d;
      --muted: #8590a8;
      --surface: #ffffff;
      --background: #f6f8ff;
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--background);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    button { font: inherit; }

    .welcome-screen {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 28px 24px;
      background: #fff;
    }
    .welcome-content {
      display: flex;
      width: min(100%, 440px);
      min-height: min(680px, calc(100vh - 56px));
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .logo-circle {
      display: grid;
      width: 132px;
      height: 132px;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: linear-gradient(135deg, var(--pink), var(--teal));
      box-shadow: 0 14px 30px #e87da64a;
      font-family: Georgia, serif;
      font-size: 66px;
      font-weight: 700;
      font-style: italic;
    }
    .welcome-title { margin: 34px 0 12px; font-size: clamp(28px, 7vw, 38px); line-height: 1.25; }
    .welcome-subtitle { margin: 0; color: var(--muted); font-size: 16px; letter-spacing: .02em; }
    .start-button {
      width: 100%;
      margin-top: auto;
      padding: 17px 24px;
      border: 0;
      border-radius: 18px;
      color: #fff;
      background: linear-gradient(100deg, var(--pink), var(--coral) 45%, var(--teal));
      box-shadow: 0 12px 24px #df7fa95c;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: .08em;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .start-button:hover { transform: translateY(-2px); box-shadow: 0 16px 28px #df7fa978; }
    .start-button:focus-visible, .word-card:focus-visible { outline: 3px solid #ffb34d; outline-offset: 3px; }

    .learning-screen { display: none; min-height: 100vh; padding: 34px 18px 48px; }
    .learning-screen.visible { display: block; }
    .learning-header { width: min(100%, 980px); margin: 0 auto 25px; text-align: center; }
    .learning-header h1 { margin: 0; font-size: clamp(25px, 5vw, 34px); }
    .learning-header p { margin: 9px 0 0; color: var(--muted); }
    .word-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      width: min(100%, 980px);
      margin: 0 auto;
    }
    .word-card {
      display: flex;
      position: relative;
      min-height: 205px;
      padding: 24px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid transparent;
      border-radius: 22px;
      color: inherit;
      background: var(--surface);
      box-shadow: 0 8px 22px #46517d16;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .word-card:hover { transform: translateY(-3px); box-shadow: 0 14px 28px #46517d24; }
    .word-card.active {
      border-color: var(--pink);
      background: linear-gradient(135deg, #fff8fb, #f5fffd);
      box-shadow: 0 14px 29px #ec7fa346;
    }
    .word-number {
      position: absolute;
      top: 17px;
      left: 20px;
      color: var(--pink);
      font-size: 15px;
      font-weight: 800;
    }
    .word-english { font-size: clamp(24px, 4vw, 32px); font-weight: 800; line-height: 1.18; text-align: center; }
    .word-phonetic { margin-top: 11px; color: #6c7895; font-family: Georgia, serif; font-size: 17px; }
    .word-meaning { margin-top: 12px; color: var(--teal); font-size: 18px; font-weight: 700; }
    .speaker { position: absolute; right: 19px; bottom: 17px; color: var(--blue); font-size: 20px; }

    @media (max-width: 560px) {
      .welcome-content { min-height: min(620px, calc(100vh - 56px)); }
      .logo-circle { width: 116px; height: 116px; font-size: 57px; }
      .learning-screen { padding: 24px 14px 36px; }
      .word-grid { grid-template-columns: 1fr; gap: 14px; }
      .word-card { min-height: 184px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <section id="welcomeScreen" class="welcome-screen" aria-labelledby="welcomeTitle">
    <div class="welcome-content">
      <div class="logo-circle" aria-label="蓓蓓英语标志">B</div>
      <h1 id="welcomeTitle" class="welcome-title">欢迎来到蓓蓓英语！</h1>
      <p class="welcome-subtitle">Be Better Studio - 开启智能学习之旅</p>
      <button id="startButton" class="start-button" type="button">开始学习</button>
    </div>
  </section>

  <main id="learningScreen" class="learning-screen" aria-labelledby="learningTitle" aria-hidden="true">
    <header class="learning-header">
      <h1 id="learningTitle">蓓蓓英语 · 单词学习</h1>
      <p>点击卡片，连续聆听两遍单词发音</p>
    </header>
    <section id="wordGrid" class="word-grid" aria-label="英语单词卡片"></section>
  </main>

  <script>
    const words = [
      ['usually', '/ˈjuːʒuəli/', '经常；通常'], ['rarely', '/ˈreəli/', '罕有；很少'],
      ['sometimes', '/ˈsʌmtaɪmz/', '有时候'], ['never', '/ˈnevə(r)/', '从不'],
      ['camping', '/ˈkæmpɪŋ/', '露营；宿营'], ['camp', '/kæmp/', '营帐'],
      ['campsite', '/ˈkæmpsaɪt/', '野营地'], ['tent', '/tent/', '帐篷'],
      ['barbecue', '/ˈbɑːbɪkjuː/', '烧烤；户外烧烤'], ['bicycle', '/ˈbaɪsɪkl/', '自行车'],
      ['bike', '/baɪk/', '自行车'], ['cycling', '/ˈsaɪklɪŋ/', '骑自行车'],
      ['reading', '/ˈriːdɪŋ/', '阅读'], ['painting', '/ˈpeɪntɪŋ/', '画画'],
      ['writing', '/ˈraɪtɪŋ/', '写作'], ['singing', '/ˈsɪŋɪŋ/', '歌唱'],
      ['dancing', '/ˈdɑːnsɪŋ/', '跳舞'], ['playing basketball', '/ˈpleɪɪŋ ˈbɑːskɪtbɔːl/', '打篮球'],
      ['swimming', '/ˈswɪmɪŋ/', '游泳'], ['hiking', '/ˈhaɪkɪŋ/', '徒步'],
      ['running', '/ˈrʌnɪŋ/', '跑步'], ['surfing', '/ˈsɜːfɪŋ/', '冲浪'], ['cooking', '/ˈkʊkɪŋ/', '烹饪']
    ];

    const welcomeScreen = document.querySelector('#welcomeScreen');
    const learningScreen = document.querySelector('#learningScreen');
    const wordGrid = document.querySelector('#wordGrid');
    let activeCard;

    function preferredVoice(language) {
      const voices = speechSynthesis.getVoices().filter((voice) => voice.lang.toLowerCase().startsWith(language));
      return voices.find((voice) => /female|woman|zira|susan|hazel|samantha|aria|xiaoxiao|huihui|yaoyao/i.test(voice.name)) || voices[0];
    }

    function speak(text, language, onend) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = language;
      utterance.rate = 0.85;
      utterance.voice = preferredVoice(language.slice(0, 2)) || null;
      utterance.onend = onend;
      utterance.onerror = onend;
      speechSynthesis.speak(utterance);
    }

    function playWord(word, card) {
      speechSynthesis.cancel();
      if (activeCard) activeCard.classList.remove('active');
      activeCard = card;
      card.classList.add('active');
      speak(word, 'en-GB', () => speak(word, 'en-GB'));
    }

    words.forEach(([word, phonetic, meaning], index) => {
      const card = document.createElement('button');
      card.className = 'word-card';
      card.type = 'button';
      card.setAttribute('aria-label', `播放 ${word}，${meaning}`);
      card.innerHTML = `<span class="word-number">${index + 1}</span><span class="word-english">${word}</span><span class="word-phonetic">${phonetic}</span><span class="word-meaning">${meaning}</span><span class="speaker" aria-hidden="true">🔊</span>`;
      card.addEventListener('click', () => playWord(word, card));
      wordGrid.append(card);
    });

    document.querySelector('#startButton').addEventListener('click', () => {
      speechSynthesis.cancel();
      speak('welcome to be better studio', 'en-GB', () => {
        speak('欢迎来到蓓蓓英语工作室', 'zh-CN', () => {
          welcomeScreen.hidden = true;
          learningScreen.classList.add('visible');
          learningScreen.setAttribute('aria-hidden', 'false');
        });
      });
    });
  </script>
</body>
</html>
